routeEnhancers:
  BenchExtbaseApi:
    type: Extbase
    limitToPages: [1]
    extension: BenchExtbase
    plugin: Api
    routes:
      - routePath: '/_extbase/articles/{page}/{size}'
        _controller: 'Article::list'
      - routePath: '/_extbase/articles/{article}'
        _controller: 'Article::show'
    defaultController: 'Article::list'
    aspects:
      page:
        type: StaticRangeMapper
        start: '1'
        end: '1000'
      size:
        type: StaticValueMapper
        map:
          '20': '20'
          '100': '100'
      article:
        type: PersistedPatternMapper
        tableName: tx_bench_article
        routeFieldPattern: '^(?P<uid>\d+)$'
        routeFieldResult: '{uid}'
  PageTypeSuffix:
    type: PageType
    default: '/'
    map:
      '/': 0
      '.json': 1801
