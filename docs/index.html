* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {

}
a { color: var(--accent); text-underline-offset: 2px; }

button, select { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
[data-series] { transition: opacity 120ms; }
.num, .tnum { font-variant-numeric: tabular-nums; }

/* Navigation */
.navbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 48px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-logo { color: var(--accent); display: flex; flex: none; }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
.crumbs .parent { color: var(--muted); }
.crumbs h1 { font-size: 15px; font-weight: 500; margin: 0; overflow: hidden; text-overflow: ellipsis; }
.nav-actions { display: flex; gap: 6px; align-items: center; flex: none; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; font-size: 13px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; white-space: nowrap; }
.tbtn:hover { border-color: var(--border-strong); }
.tbtn.icon { width: 32px; padding: 0; justify-content: center; }
.tbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Variables */
.varbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px 4px; }
.variable { display: flex; height: 32px; }
.var-label { display: flex; align-items: center; padding: 0 10px; font-size: 13px; font-weight: 500; background: var(--surface-2); border: 1px solid var(--border); border-right: 0; border-radius: 4px 0 0 4px; white-space: nowrap; }
.var-input { display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; min-width: 7rem; padding: 0 8px; font-size: 13px; color: var(--ink); background: var(--input); border: 1px solid var(--border); border-radius: 0 4px 4px 0; cursor: pointer; }
.var-input:hover { border-color: var(--border-strong); }
.select-wrap { position: relative; display: flex; }
.select-wrap select { appearance: none; padding-right: 28px; }
.select-wrap svg { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); }
.var-spacer { flex: 1; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.link-chip { font-size: 12px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; background: var(--surface); white-space: nowrap; }

/* Rows and panels */
main { padding: 4px 16px 24px; }
.row { margin-top: 6px; }
.row-head { display: flex; align-items: center; gap: 6px; width: 100%; padding: 8px 0; background: none; border: 0; color: var(--ink); font-size: 15px; font-weight: 500; cursor: pointer; text-align: left; }
.row-head svg { color: var(--muted); flex: none; }
.row-head:hover .row-title { color: var(--accent); }
.row-count { color: var(--muted); font-size: 13px; font-weight: 400; }
.panels { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 8px; }
.panel { grid-column: span var(--w, 24); background: var(--surface); border: 1px solid var(--border); border-radius: 4px; min-width: 0; display: flex; flex-direction: column; }
.panel[data-w="3"] { --w: 3; }
.panel[data-w="4"] { --w: 4; }
.panel[data-w="6"] { --w: 6; }
.panel[data-w="8"] { --w: 8; }
.panel[data-w="12"] { --w: 12; }

  .panel[data-w="4"] { --w: 8; }
  .panel[data-w="6"] { --w: 12; }
}
@media (max-width: 860px) {
  .panel[data-w="3"], .panel[data-w="4"] { --w: 12; }
  .panel[data-w="6"], .panel[data-w="8"], .panel[data-w="12"] { --w: 24; }
}
@media (max-width: 520px) {
  .panel[data-w] { --w: 24; }
}
.panel-head { display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 2px 6px 0 12px; }
.panel-title { font-size: 14px; font-weight: 500; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel-info { color: var(--muted); display: flex; cursor: help; flex: none; }
.panel-spacer { flex: 1; }
.panel-select { height: 24px; font-size: 12px; color: var(--ink); background: var(--input); border: 1px solid var(--border); border-radius: 3px; padding: 0 22px 0 6px; cursor: pointer; }
.panel-select-wrap svg { right: 5px; }
.panel-menu-btn { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0; color: var(--muted); background: none; border: 0; border-radius: 3px; cursor: pointer; opacity: 0; flex: none; }
.panel-menu-btn:hover { color: var(--ink); background: var(--wash); }
.panel:hover .panel-menu-btn, .panel:focus-within .panel-menu-btn, .panel-menu-btn[aria-expanded="true"] { opacity: 1; }
@media (hover: none) { .panel-menu-btn { opacity: 1; } }
.panel-body { padding: 4px 12px 12px; flex: 1; min-height: 0; min-width: 0; }
.view-bar { display: flex; align-items: center; gap: 10px; margin: 8px 0; }

/* Text panel */
.about h2 { font-size: clamp(1.25rem, 2.6vw, 1.7rem); line-height: 1.2; font-weight: 600; margin: 4px 0 8px; letter-spacing: -0.01em; }
.about p { margin: 0 0 8px; max-width: 62rem; color: var(--ink-2); }
.about .hints { font-size: 12px; color: var(--muted); }
kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 1px 5px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 3px; color: var(--ink-2); }
.text-panel ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; }
.text-panel li { margin-bottom: 6px; }
pre { background: var(--wash); border-radius: 4px; padding: 10px 12px; overflow-x: auto; font-size: 12px; margin: 0; }

/* Stat */
.panel-stat { box-shadow: inset 0 3px 0 var(--sc); }
.stat { display: flex; flex-direction: column; height: 100%; }
.stat-value { font-size: 30px; font-weight: 500; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat-unit { font-size: 15px; color: var(--muted); margin-left: 3px; font-weight: 400; }
.stat-sub { font-size: 12px; color: var(--ink-2); }
.stat-meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sparkline { display: block; margin-top: auto; padding-top: 8px; }

/* Bar gauge */
.gauge { display: grid; grid-template-columns: minmax(4.5rem, 7rem) minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; }
.gauge-label { font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gauge-track { position: relative; height: 22px; background: var(--wash); border-radius: 3px; cursor: default; }
.gauge-bar { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; min-width: 2px; background: linear-gradient(90deg, color-mix(in srgb, var(--sc) 30%, transparent), var(--sc)); }
.gauge-value { font-size: 14px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; min-width: 4.2rem; white-space: nowrap; }
.gauge-value .unit { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 2px; }
.whisker { position: absolute; top: 50%; height: 2px; transform: translateY(-50%); background: var(--ink); opacity: 0.6; }
.whisker::before, .whisker::after { content: ""; position: absolute; top: -4px; width: 2px; height: 10px; background: inherit; }
.whisker::before { left: 0; }
.whisker::after { right: 0; }
.panel-note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

/* Time series */
.ts-chart { width: 100%; }
.line-chart { display: block; overflow: visible; }
.line-chart .grid { stroke: var(--grid); stroke-width: 1; }
.line-chart .axis { stroke: var(--axis); stroke-width: 1; }
.line-chart .crosshair { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.line-chart .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.line-chart .xlabel { fill: var(--ink-2); font-size: 12px; font-weight: 500; }
.line-chart .xsub { fill: var(--muted); font-size: 11px; }
.line-chart .end-note { fill: var(--muted); font-size: 11px; }
.line-chart .hit { outline: none; cursor: crosshair; }
.line-chart .hit:focus-visible { fill: var(--wash); }
.legend-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
.legend-table th { font-weight: 500; color: var(--ink-2); text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
.legend-table td { padding: 4px 8px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.legend-table th:first-child, .legend-table td:first-child { text-align: left; }
.legend-table tbody tr { cursor: pointer; }
.legend-table tbody tr:hover { background: var(--wash); }
.legend-table tr.off { opacity: 0.4; }
.legend-table tr.off .swatch { background: var(--muted) !important; }
.legend-table .note { color: var(--muted); }
.legend-scroll { overflow-x: auto; }
.swatch { display: inline-block; width: 14px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 8px; }
.legend-hint { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 11px; }

.table-wrap { overflow-x: auto; }
table.data-table, table.matrix { border-collapse: collapse; width: 100%; font-size: 13px; }
.data-table th, .data-table td, .matrix th, .matrix td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }

.sort { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 0; color: inherit; font-weight: 500; cursor: pointer; }

.files { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12px; }
.files li { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; border-bottom: 1px dotted var(--grid); }
.files li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
details.pkg { border-bottom: 1px solid var(--grid); padding: 6px 0; }

.findings { margin: 4px 0 0; padding-left: 18px; font-size: 12px; color: var(--ink-2); }

/* Overlays */
.tooltip { position: fixed; z-index: 60; pointer-events: none; min-width: 180px; max-width: 320px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); border-radius: 4px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; line-height: 1.45; opacity: 0; transition: opacity 80ms; }

.tip-row { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; color: var(--ink-2); }

.popover { position: fixed; z-index: 50; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; box-shadow: var(--shadow); padding: 4px; min-width: 200px; max-width: calc(100vw - 16px); }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 10px; font-size: 13px; color: var(--ink); background: none; border: 0; border-radius: 3px; cursor: pointer; text-align: left; }
.menu-item:hover, .menu-item:focus-visible { background: var(--wash); outline: none; }
.menu-item span { flex: 1; }
.menu-item svg { color: var(--muted); }
.check-item { display: flex; align-items: center; gap: 10px; padding: 6px 10px; font-size: 13px; border-radius: 3px; cursor: pointer; }
.check-item:hover { background: var(--wash); }
.check-item input { accent-color: var(--accent); margin: 0; }
.check-item .muted { margin-left: auto; font-size: 11px; }
.menu-sep { height: 1px; background: var(--border); margin: 4px 0; }
.info-list { padding: 8px 10px; font-size: 12px; display: grid; grid-template-columns: auto 1fr; gap: 3px 16px; }
.info-list dt { color: var(--muted); }
.info-list dd { margin: 0; font-variant-numeric: tabular-nums; }
.info-list h4 { grid-column: 1 / -1; margin: 6px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(820px, 100%); z-index: 40; display: flex; flex-direction: column; gap: 12px; padding: 16px; overflow: auto; background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow); }
.drawer-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.drawer-head h2 { font-size: 17px; font-weight: 500; margin: 0 0 2px; }
.drawer-actions { display: flex; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 70; background: var(--surface-2); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 4px; padding: 8px 14px; font-size: 13px; }
body.kiosk .navbar, body.kiosk .varbar { display: none; }
body.kiosk main { padding-top: 12px; }
.empty { color: var(--muted); font-style: italic; }
footer { font-size: 12px; color: var(--muted); padding: 16px 0 0; }

@media (max-width: 640px) {
  .crumbs .parent, .crumbs .sep, .runs-label { display: none; }
  .var-spacer { display: none; }
  .stat-value { font-size: 26px; }
}
@media (forced-colors: active) {
  .gauge-bar, .line-chart path, .line-chart circle, .swatch { forced-color-adjust: none; border: 1px solid CanvasText; }
}
</style>

<script>
(() => {
  const data = JSON.parse(document.getElementById('benchmark-data').textContent);
  if (typeof data !== 'object') {
    document.getElementById('dashboard').innerHTML = '<p class="empty">No results embedded. Build this page with <code>bin/bench site</code>.</p>';
    return;
  }

  const el = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [name, value] of Object.entries(attrs)) {
      if (value === undefined || value === null || value === false) continue;
      if (name === 'class') node.className = value;
      else if (name === 'style') for (const [key, v] of Object.entries(value)) key.startsWith('--') ? node.style.setProperty(key, v) : (node.style[key] = v);
      else if (name.startsWith('data-') || name.startsWith('aria-') || name === 'role' || name === 'tabindex' || name === 'type' || name === 'hidden') node.setAttribute(name, value);
      else node[name] = value;
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  };
  const svgEl = (tag, attrs = {}) => {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, value);
    return node;
  };
  const svgText = (attrs, text) => { const node = svgEl('text', attrs); node.textContent = text; return node; };

  const ICONS = {
    caret: 'M4.5 6.5L8 10l3.5-3.5',
    chevron: 'M6.5 4.5L10 8l-3.5 3.5',
    dots: 'M8 3.5h.01M8 8h.01M8 12.5h.01',
    info: 'M14 8A6 6 0 112 8a6 6 0 0112 0zM8 7.5v3.5M8 5h.01',
    clock: 'M14 8A6 6 0 112 8a6 6 0 0112 0zM8 4.8V8l2.2 1.4',
    share: 'M10 2.5h3.5V6M13.5 2.5L8 8M11.5 9.5v3.5a.5.5 0 01-.5.5H3a.5.5 0 01-.5-.5V5a.5.5 0 01.5-.5h3.5',
    kiosk: 'M2 3.5h12v8H2zM6 14h4M8 11.5V14',
    sun: 'M11 8a3 3 0 11-6 0 3 3 0 016 0zM8 1.5V3M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1',
    moon: 'M13.5 9.5A5.5 5.5 0 116.5 2.5a4.5 4.5 0 007 7z',
    close: 'M4 4l8 8M12 4l-8 8',
    eye: 'M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8zM10 8a2 2 0 11-4 0 2 2 0 014 0z',
    table: 'M2 3h12v10H2zM2 6.5h12M2 10h12M6 6.5V13',
    download: 'M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10',
    back: 'M10 3.5L5.5 8 10 12.5',
    logo: 'M2 11.5a6 6 0 0112 0M8 11.5l3-4M4.2 7.2l.8.6M8 5.5v1M11.8 7.2l-.8.6',
  };
  const icon = (name, size = 16) => {
    const svg = svgEl('svg', { width: size, height: size, viewBox: '0 0 16 16', 'aria-hidden': 'true' });
    svg.append(svgEl('path', { d: ICONS[name], fill: 'none', stroke: 'currentColor', 'stroke-width': name === 'dots' ? 2.4 : 1.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    return svg;
  };

  const contenders = data.contenders;
  const color = (key) => `var(--series-${contenders.findIndex((c) => c.key === key) + 1})`;
  const fmt = (value, digits = 0) => (value === null || value === undefined || Number.isNaN(value)) ? '–' : value.toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
  const fmtDate = (iso) => new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const fmtTick = (v) => {
    if (v >= 1000) return `${fmt(v / 1000, v % 1000 ? 1 : 0)}k`;
    return fmt(v, Math.abs(v - Math.round(v)) < 1e-9 ? 0 : v < 1 ? 2 : 1);
  };
  const niceMax = (value) => {
    if (!(value > 0)) return 1;
    const magnitude = 10 ** Math.floor(Math.log10(value));
    for (const step of [1, 1.2, 1.6, 2, 2.4, 3.2, 4, 4.8, 6, 8, 10]) {
      if (step * magnitude >= value) return step * magnitude;
    }
    return 10 * magnitude;
  };
  const swatch = (key) => el('span', { class: 'swatch', style: { background: color(key) } });

  const env = data.environment;
  const versions = env.versions;
  const versionOf = { tcaapi: 'maikschneider/tca-api', t3api: 'sourcebroker/t3api', sgapicore: 'sgalinski/sg-apicore', nnrestapi: 'nng/nnrestapi' };
  const versionText = (c) => (versionOf[c.key] ? `${versionOf[c.key]} ${versions[versionOf[c.key]] || ''}`.trim() : 'hand-written on TYPO3 core');

  const passes = [{ key: 'miss', label: 'Cold' }, { key: 'hit', label: 'Cached' }];
  const scales = [{ key: 'linear', label: 'Linear' }, { key: 'log', label: 'Logarithmic' }];
  const METRICS = [
    { key: 'appMs', label: 'Server time', unit: 'ms', digits: 1, better: 'lower' },
    { key: 'queries', label: 'Queries', unit: 'queries', digits: 0, better: 'lower' },
    { key: 'p50', label: 'Response time (median)', unit: 'ms', digits: 1, better: 'lower' },
    { key: 'p95', label: 'Response time (p95)', unit: 'ms', digits: 1, better: 'lower' },
    { key: 'rps', label: 'Throughput', unit: 'req/s', digits: 0, better: 'higher' },
    { key: 'payloadKb', label: 'Response size', unit: 'KB', digits: 1, better: 'lower' },
    { key: 'memoryMb', label: 'Memory', unit: 'MB', digits: 1, better: 'lower' },
  ];
  const DEFAULT_METRIC = { size: 'appMs', depth: 'queries', concurrency: 'rps' };
  const baseSuite = data.suites.find((suite) => suite.key === 'base');
  const sweepSuites = data.suites.filter((s) => s.key !== 'base' && data.load[s.key]);
  const value = (suite, point, key, pass, metric) => data.load[suite]?.[point]?.[key]?.[pass]?.[metric] ?? NaN;
  const unsupported = (c, point) => Boolean(point.pageSize && c.maxPageSize && point.pageSize > c.maxPageSize.size);

  // State, mirrored in the URL so a view can be shared
  const state = {
    api: new Set(contenders.map((c) => c.key)),
    request: baseSuite.points[0].key,
    cache: 'miss',
    scale: 'linear',
    metric: { ...DEFAULT_METRIC },
    view: null,
    kiosk: false,
    isolate: {},
    legendSort: {},
    collapsed: new Set(['method']),
  };
  const params = new URLSearchParams(location.search);
  const apiParam = (params.get('api') || '').split(',').filter((key) => contenders.some((c) => c.key === key));
  if (apiParam.length) state.api = new Set(apiParam);
  if (baseSuite.points.some((p) => p.key === params.get('request'))) state.request = params.get('request');
  if (passes.some((p) => p.key === params.get('cache'))) state.cache = params.get('cache');
  if (params.get('scale') === 'log') state.scale = 'log';
  for (const suite of sweepSuites) {
    const metric = params.get(`metric-${suite.key}`);
    if (METRICS.some((m) => m.key === metric)) state.metric[suite.key] = metric;
  }
  if (params.get('viewPanel')) state.view = params.get('viewPanel');
  if (params.has('kiosk')) state.kiosk = true;
  try {
    const collapsed = JSON.parse(localStorage.getItem('bench-collapsed') || 'null');
    if (Array.isArray(collapsed)) state.collapsed = new Set(collapsed);
  } catch {}

  const urlFor = () => {
    const p = new URLSearchParams();
    if (state.api.size !== contenders.length) p.set('api', contenders.filter((c) => state.api.has(c.key)).map((c) => c.key).join(','));
    if (state.request !== baseSuite.points[0].key) p.set('request', state.request);
    if (state.cache !== 'miss') p.set('cache', state.cache);
    if (state.scale !== 'linear') p.set('scale', state.scale);
    for (const suite of sweepSuites) if (state.metric[suite.key] !== DEFAULT_METRIC[suite.key]) p.set(`metric-${suite.key}`, state.metric[suite.key]);
    if (state.view) p.set('viewPanel', state.view);
    if (state.kiosk) p.set('kiosk', '');
    const query = p.toString().replace(/kiosk=(&|$)/, 'kiosk$1');
    return query ? `?${query}` : location.pathname;
  };
  const syncUrl = () => { try { history.replaceState(null, '', urlFor()); } catch {} };

  const visible = (panelId) => {
    const selected = contenders.filter((c) => state.api.has(c.key));
    const isolated = state.isolate[panelId];
    if (isolated) {
      const shown = selected.filter((c) => isolated.has(c.key));
      if (shown.length) return shown;
    }
    return selected;
  };

  // Hovering a series anywhere highlights it in every panel
  const focusStyle = document.createElement('style');
  document.head.append(focusStyle);
  let focused = null;
  const setFocus = (key) => {
    if (key === focused) return;
    focused = key;
    focusStyle.textContent = key ? `main [data-series]:not([data-series="${key}"]) { opacity: 0.22; }` : '';
  };
  document.addEventListener('pointerover', (event) => {
    const target = event.target instanceof Element ? event.target.closest('main [data-series]') : null;
    setFocus(target ? target.dataset.series : null);
  });

  // Tooltip
  const tooltip = document.getElementById('tooltip');
  const showTip = (target, build, event) => {
    tooltip.replaceChildren(...build());
    tooltip.classList.add('visible');
    const rect = target.getBoundingClientRect();
    const x = event && event.clientX ? event.clientX : rect.left + rect.width / 2;
    const y = event && event.clientY ? event.clientY : rect.top;
    const width = tooltip.offsetWidth;
    const height = tooltip.offsetHeight;
    const left = x + 16 + width > window.innerWidth - 8 ? x - width - 16 : x + 16;
    tooltip.style.left = `${Math.max(8, left)}px`;
    tooltip.style.top = `${Math.min(Math.max(8, y - height / 2), window.innerHeight - height - 8)}px`;
  };
  const hideTip = () => tooltip.classList.remove('visible');
  const attachTip = (target, build) => {
    target.addEventListener('pointermove', (event) => showTip(target, build, event));
    target.addEventListener('pointerleave', hideTip);
    target.addEventListener('focus', () => showTip(target, build));
    target.addEventListener('blur', hideTip);
  };
  const tipRow = (key, label, val) => el('div', { class: 'tip-row' }, key ? swatch(key) : el('span'), el('span', {}, label), el('span', { class: 'tip-value' }, val));

  // Popover, used by menus and pickers
  const popover = document.getElementById('popover');
  let popoverAnchor = null;
  const closePopover = () => {
    if (popover.hidden) return;
    popover.hidden = true;
    popoverAnchor?.setAttribute('aria-expanded', 'false');
    popoverAnchor = null;
  };
  const openPopover = (anchor, content, align = 'start') => {
    if (popoverAnchor === anchor) { closePopover(); return; }
    closePopover();
    popover.replaceChildren(content);
    popover.hidden = false;
    popoverAnchor = anchor;
    anchor.setAttribute('aria-expanded', 'true');
    const rect = anchor.getBoundingClientRect();
    const width = popover.offsetWidth;
    const left = align === 'end' ? rect.right - width : rect.left;
    popover.style.left = `${Math.min(Math.max(8, left), window.innerWidth - width - 8)}px`;
    popover.style.top = `${rect.bottom + 4}px`;
  };
  document.addEventListener('pointerdown', (event) => {
    if (!popover.hidden && !popover.contains(event.target) && !popoverAnchor?.contains(event.target)) closePopover();
  });

  const toast = (text) => {
    const node = el('div', { class: 'toast', role: 'status' }, text);
    document.body.append(node);
    setTimeout(() => node.remove(), 2200);
  };

  // Data tables, sortable by column
  const cellText = (header, v) => (typeof v === 'number' ? fmt(v, header.digits ?? 0) : (v ?? '–'));
  function dataTable(table) {
    let sort = null;
    const tbody = el('tbody');
    const compare = (a, b) => {
      const x = a.row[sort.index];
      const y = b.row[sort.index];
      const xn = typeof x === 'number' && !Number.isNaN(x);
      const yn = typeof y === 'number' && !Number.isNaN(y);
      if (xn && yn) return (x - y) * sort.dir;
      if (xn !== yn) return xn ? -1 : 1;
      return String(x ?? '').localeCompare(String(y ?? '')) * sort.dir;
    };
    const fill = () => {
      const rows = table.rows.map((row, i) => ({ row, key: table.series?.[i] }));
      if (sort) rows.sort(compare);
      tbody.replaceChildren(...rows.map(({ row, key }) => el('tr', { 'data-series': key }, ...row.map((v, i) => el('td', { class: table.headers[i].num ? 'num' : '' }, cellText(table.headers[i], v))))));
    };
    const ths = table.headers.map((header, index) => {
      const indicator = el('span', { class: 'sort-ind', 'aria-hidden': 'true' });
      const button = el('button', { type: 'button', class: 'sort' }, header.label, indicator);
      const th = el('th', { class: header.num ? 'num' : '', 'aria-sort': 'none' }, button);
      button.addEventListener('click', () => {
        sort = sort?.index !== index ? { index, dir: 1 } : sort.dir === 1 ? { index, dir: -1 } : null;
        for (const other of ths) { other.setAttribute('aria-sort', 'none'); other.querySelector('.sort-ind').textContent = ''; }
        if (sort) { th.setAttribute('aria-sort', sort.dir === 1 ? 'ascending' : 'descending'); indicator.textContent = sort.dir === 1 ? '↑' : '↓'; }
        fill();
      });
      return th;
    });
    fill();
    return el('table', { class: 'data-table' }, el('thead', {}, el('tr', {}, ...ths)), tbody);
  }

  function downloadCsv(panel) {
    const table = panel.data();
    const escape = (v) => {
      const text = v === null || v === undefined || (typeof v === 'number' && Number.isNaN(v)) ? '' : typeof v === 'number' ? String(Math.round(v * 1000) / 1000) : String(v);
      return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    };
    const csv = [table.headers.map((h) => escape(h.label)).join(','), ...table.rows.map((row) => row.map(escape).join(','))].join('\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    const link = el('a', { href: url, download: `typo3-api-benchmark-${panel.id}.csv` });
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // Inspect drawer
  const drawer = document.getElementById('drawer');
  const closeDrawer = () => { drawer.hidden = true; };
  function inspect(panel) {
    const table = panel.data();
    const close = el('button', { type: 'button', class: 'tbtn icon', 'aria-label': 'Close' }, icon('close'));
    close.addEventListener('click', closeDrawer);
    const download = el('button', { type: 'button', class: 'tbtn' }, icon('download'), 'Download CSV');
    download.addEventListener('click', () => downloadCsv(panel));
    drawer.replaceChildren(
      el('div', { class: 'drawer-head' }, el('div', {}, el('h2', {}, `Inspect: ${panel.title}`), el('p', { class: 'small muted', style: { margin: 0 } }, table.note || '')), close),
      el('div', { class: 'drawer-actions' }, download),
      el('div', { class: 'table-wrap' }, dataTable(table)),
    );
    drawer.hidden = false;
    close.focus();
  }

  function toggleView(id) {
    state.view = state.view === id ? null : id;
    renderPanels();
    window.scrollTo(0, 0);
  }

  function openMenu(anchor, panel) {
    const items = [
      ['eye', state.view === panel.id ? 'Back to dashboard' : 'View', 'v', () => toggleView(panel.id)],
      panel.data && ['table', 'Inspect data', 'i', () => inspect(panel)],
      panel.data && ['download', 'Download CSV', null, () => downloadCsv(panel)],
    ].filter(Boolean);
    const menu = el('div', { role: 'menu' }, ...items.map(([name, label, key, action]) => {
      const item = el('button', { type: 'button', role: 'menuitem', class: 'menu-item' }, icon(name), el('span', {}, label), key ? el('kbd', {}, key) : null);
      item.addEventListener('click', () => { closePopover(); action(); });
      return item;
    }));
    openPopover(anchor, menu, 'end');
    menu.querySelector('button')?.focus();
  }

  // Panel chrome
  let hoveredPanel = null;
  function panelNode(panel) {
    const head = el('div', { class: 'panel-head' }, el('h3', { class: 'panel-title', title: panel.title }, panel.title));
    if (panel.description) {
      const info = el('span', { class: 'panel-info', tabindex: '0', 'aria-label': panel.description }, icon('info', 14));
      attachTip(info, () => [el('div', {}, panel.description)]);
      head.append(info);
    }
    head.append(el('span', { class: 'panel-spacer' }));
    if (panel.headerExtra) head.append(panel.headerExtra());
    const menuButton = el('button', { type: 'button', class: 'panel-menu-btn', 'aria-label': `Menu for ${panel.title}`, 'aria-haspopup': 'menu', 'aria-expanded': 'false' }, icon('dots'));
    menuButton.addEventListener('click', () => openMenu(menuButton, panel));
    head.append(menuButton);
    const body = el('div', { class: 'panel-body' });
    const node = el('section', { class: `panel panel-${panel.type}`, 'data-w': String(state.view ? 24 : panel.w), 'data-panel': panel.id, style: panel.style }, head, body);
    node.addEventListener('pointerenter', () => { hoveredPanel = panel; });
    node.addEventListener('pointerleave', () => { if (hoveredPanel === panel) hoveredPanel = null; });
    return { node, body };
  }

  const selectInput = (options, current, onChange, label, className = 'var-input') => {
    const select = el('select', { class: className, 'aria-label': label }, ...options.map((o) => el('option', { value: o.key, selected: o.key === current }, o.label)));
    select.addEventListener('change', () => onChange(select.value));
    return el('span', { class: `select-wrap ${className === 'panel-select' ? 'panel-select-wrap' : ''}` }, select, icon('caret', 14));
  };

  // Charts
  function barGauge(container, panelId, pick, { digits = 0, unit = '', range = false, tip } = {}) {
    const rows = visible(panelId).map((c) => {
      const m = data.load.base?.[state.request]?.[c.key]?.[state.cache];
      return { c, m, v: m ? pick(m) : NaN };
    });
    const peak = Math.max(0, ...rows.map((r) => (range ? Math.max(r.v, r.m?.p50Max ?? 0) : r.v)).filter((v) => !Number.isNaN(v)));
    const max = niceMax(peak * 1.05);
    const gauge = el('div', { class: 'gauge', role: 'list' });
    for (const { c, m, v } of rows) {
      const missing = Number.isNaN(v);
      const track = el('div', { class: 'gauge-track', tabindex: '0', role: 'listitem', 'data-series': c.key, 'aria-label': `${c.label}: ${missing ? 'no value' : `${fmt(v, digits)} ${unit}`}` },
        missing ? null : el('span', { class: 'gauge-bar', style: { width: `${(v / max) * 100}%`, '--sc': color(c.key) } }),
        range && m && !missing ? el('span', { class: 'whisker', style: { left: `${(m.p50Min / max) * 100}%`, width: `${((m.p50Max - m.p50Min) / max) * 100}%` } }) : null);
      if (tip) attachTip(track, () => tip(c, m));
      gauge.append(
        el('span', { class: 'gauge-label', 'data-series': c.key, title: c.label }, c.label),
        track,
        el('span', { class: 'gauge-value', 'data-series': c.key }, missing ? 'n/a' : fmt(v, digits), missing || !unit ? null : el('span', { class: 'unit' }, unit)),
      );
    }
    container.replaceChildren(gauge);
  }

  function yScale(values, top, plotHeight, log) {
    if (log) {
      const positives = values.filter((v) => Number.isFinite(v) && v > 0);
      const low = Math.floor(Math.log10(Math.min(...positives)));
      let high = Math.ceil(Math.log10(Math.max(...positives)));
      if (high <= low) high = low + 1;
      const ticks = [];
      for (let e = low; e <= high; e++) {
        ticks.push(10 ** e);
        if (high - low <= 2 && e < high) ticks.push(2 * 10 ** e, 5 * 10 ** e);
      }
      return { ticks, y: (v) => top + plotHeight - ((Math.log10(v) - low) / (high - low)) * plotHeight, ok: (v) => Number.isFinite(v) && v > 0 };
    }
    const max = niceMax(Math.max(0, ...values.filter(Number.isFinite)) * 1.1);
    return { ticks: [0, 0.25, 0.5, 0.75, 1].map((f) => max * f), y: (v) => top + plotHeight - (v / max) * plotHeight, ok: Number.isFinite };
  }

  function lineChart(container, suite, panelId, height) {
    const metric = METRICS.find((m) => m.key === state.metric[suite.key]);
    const points = suite.points;
    const series = visible(panelId).map((c) => ({ c, values: points.map((p) => value(suite.key, p.key, c.key, state.cache, metric.key)) }));
    const all = series.flatMap((s) => s.values);
    const width = Math.max(260, container.clientWidth);
    const narrow = width < 560;
    const margin = { top: 20, right: 22, bottom: narrow ? 28 : 44, left: 48 };
    const plotWidth = width - margin.left - margin.right;
    const plotHeight = height - margin.top - margin.bottom;
    const log = state.scale === 'log' && all.some((v) => Number.isFinite(v) && v > 0);
    const { ticks, y, ok } = yScale(all, margin.top, plotHeight, log);
    const step = points.length > 1 ? plotWidth / (points.length - 1) : plotWidth;
    const x = (i) => margin.left + (points.length > 1 ? i * step : plotWidth / 2);

    const svg = svgEl('svg', { class: 'line-chart', width, height, viewBox: `0 0 ${width} ${height}`, role: 'img', 'aria-label': `${metric.label} per step of ${suite.label.toLowerCase()}, ${state.cache === 'miss' ? 'cold' : 'cached'}${log ? ', logarithmic axis' : ''}` });
    svg.append(svgText({ x: margin.left - 8, y: 10, 'text-anchor': 'end', class: 'tick' }, metric.unit));
    ticks.forEach((t, i) => {
      const yy = y(t);
      svg.append(svgEl('line', { x1: margin.left, x2: width - margin.right, y1: yy, y2: yy, class: i === 0 ? 'axis' : 'grid' }));
      svg.append(svgText({ x: margin.left - 8, y: yy + 4, 'text-anchor': 'end', class: 'tick' }, fmtTick(t)));
    });
    points.forEach((p, i) => {
      const anchor = points.length > 1 && i === 0 ? 'start' : points.length > 1 && i === points.length - 1 ? 'end' : 'middle';
      svg.append(svgText({ x: x(i), y: height - margin.bottom + 18, 'text-anchor': anchor, class: 'xlabel' }, narrow ? p.label.replace(/ (records?|users?)$/, '') : p.label));
      if (!narrow) svg.append(svgText({ x: x(i), y: height - margin.bottom + 33, 'text-anchor': anchor, class: 'xsub' }, p.useCase));
    });

    const crosshair = svgEl('line', { y1: margin.top, y2: margin.top + plotHeight, class: 'crosshair', visibility: 'hidden' });
    svg.append(crosshair);
    for (const s of series) {
      const group = svgEl('g', { 'data-series': s.c.key });
      let d = '';
      s.values.forEach((v, i) => {
        if (!ok(v)) return;
        d += `${d && ok(s.values[i - 1]) ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
      });
      group.append(svgEl('path', { d, fill: 'none', stroke: color(s.c.key), 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
      s.values.forEach((v, i) => {
        if (ok(v)) group.append(svgEl('circle', { cx: x(i), cy: y(v), r: 3.5, fill: color(s.c.key), stroke: 'var(--surface)', 'stroke-width': 2 }));
      });
      const firstUnsupported = points.findIndex((p) => unsupported(s.c, p));
      if (firstUnsupported > 0 && ok(s.values[firstUnsupported - 1])) {
        group.append(svgText({ x: x(firstUnsupported - 1) + 8, y: y(s.values[firstUnsupported - 1]) - 8, class: 'end-note' }, `max. ${s.c.maxPageSize.size}`));
      }
      svg.append(group);
    }

    points.forEach((p, i) => {
      const half = points.length > 1 ? step / 2 : plotWidth / 2;
      const ranked = series.filter((s) => Number.isFinite(s.values[i])).sort((a, b) => (metric.better === 'lower' ? a.values[i] - b.values[i] : b.values[i] - a.values[i]));
      const target = svgEl('rect', {
        x: x(i) - half, y: margin.top, width: half * 2, height: plotHeight, fill: 'transparent', tabindex: '0', class: 'hit',
        'aria-label': `${p.label}, ${p.useCase}: ${ranked.map((s) => `${s.c.label} ${fmt(s.values[i], metric.digits)} ${metric.unit}`).join(', ')}`,
      });
      const show = (event) => {
        crosshair.setAttribute('x1', x(i));
        crosshair.setAttribute('x2', x(i));
        crosshair.setAttribute('visibility', 'visible');
        showTip(target, () => [
          el('strong', {}, `${p.label} · ${p.useCase}`),
          ...ranked.map((s) => tipRow(s.c.key, s.c.label, `${fmt(s.values[i], metric.digits)} ${metric.unit}`)),
          ...series.filter((s) => unsupported(s.c, p)).map((s) => tipRow(s.c.key, s.c.label, `max. ${s.c.maxPageSize.size} per page`)),
        ], event);
      };
      const hide = () => { crosshair.setAttribute('visibility', 'hidden'); hideTip(); };
      target.addEventListener('pointermove', show);
      target.addEventListener('pointerleave', hide);
      target.addEventListener('focus', () => show());
      target.addEventListener('blur', hide);
      svg.append(target);
    });
    container.replaceChildren(svg);
  }

  function legendClick(panelId, key, event) {
    const selected = contenders.filter((c) => state.api.has(c.key)).map((c) => c.key);
    const shown = visible(panelId).map((c) => c.key);
    if (event.metaKey || event.ctrlKey || event.shiftKey) {
      const next = new Set(shown);
      if (next.has(key)) next.delete(key); else next.add(key);
      state.isolate[panelId] = next.size === 0 || selected.every((k) => next.has(k)) ? undefined : next;
    } else {
      state.isolate[panelId] = shown.length === 1 && shown[0] === key ? undefined : new Set([key]);
    }
    renderPanels();
  }

  function legendTable(panelId, suite) {
    const metric = METRICS.find((m) => m.key === state.metric[suite.key]);
    const points = suite.points;
    const first = points[0];
    const last = points[points.length - 1];
    const shown = new Set(visible(panelId).map((c) => c.key));
    const rows = contenders.filter((c) => state.api.has(c.key)).map((c) => {
      const values = points.map((p) => value(suite.key, p.key, c.key, state.cache, metric.key));
      const lastIndex = values.reduce((found, v, i) => (Number.isFinite(v) ? i : found), -1);
      const start = values[0];
      const end = values[lastIndex];
      return { c, start, end, lastIndex, change: start > 0 && Number.isFinite(end) ? end / start : NaN };
    });
    const columns = [
      { label: 'Name', sortValue: (r) => contenders.indexOf(r.c) },
      { label: first.label, sortValue: (r) => r.start },
      { label: last.label, sortValue: (r) => (r.lastIndex === points.length - 1 ? r.end : NaN) },
      { label: `Change`, sortValue: (r) => r.change },
    ];
    const sort = state.legendSort[panelId];
    if (sort) rows.sort((a, b) => {
      const x = columns[sort.index].sortValue(a);
      const y = columns[sort.index].sortValue(b);
      if (Number.isNaN(x) !== Number.isNaN(y)) return Number.isNaN(x) ? 1 : -1;
      return (x - y) * sort.dir;
    });
    const head = el('tr', {}, ...columns.map((column, index) => {
      const button = el('button', { type: 'button', class: 'sort' }, column.label, el('span', { class: 'sort-ind', 'aria-hidden': 'true' }, sort?.index === index ? (sort.dir === 1 ? '↑' : '↓') : ''));
      button.addEventListener('click', (event) => {
        event.stopPropagation();
        state.legendSort[panelId] = sort?.index !== index ? { index, dir: 1 } : sort.dir === 1 ? { index, dir: -1 } : undefined;
        renderPanels();
      });
      return el('th', { 'aria-sort': sort?.index === index ? (sort.dir === 1 ? 'ascending' : 'descending') : 'none' }, button);
    }));
    const body = rows.map((r) => {
      const capped = r.lastIndex >= 0 && r.lastIndex < points.length - 1;
      const row = el('tr', { class: shown.has(r.c.key) ? '' : 'off', 'data-series': r.c.key, tabindex: '0' },
        el('td', {}, swatch(r.c.key), r.c.label),
        el('td', {}, `${fmt(r.start, metric.digits)} ${metric.unit}`),
        el('td', { class: capped ? 'note' : '' }, capped ? `max. ${r.c.maxPageSize?.size ?? points[r.lastIndex].label}` : `${fmt(r.end, metric.digits)} ${metric.unit}`),
        el('td', {}, Number.isNaN(r.change) ? '–' : `×${fmt(r.change, r.change < 10 ? 1 : 0)}${capped ? ` to ${points[r.lastIndex].label.replace(/ records?$/, '')}` : ''}`),
      );
      row.addEventListener('click', (event) => legendClick(panelId, r.c.key, event));
      row.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); legendClick(panelId, r.c.key, event); } });
      return row;
    });
    const reset = el('button', { type: 'button', class: 'link-btn' }, 'Show all');
    reset.addEventListener('click', () => { state.isolate[panelId] = undefined; renderPanels(); });
    return el('div', {},
      el('div', { class: 'legend-scroll' }, el('table', { class: 'legend-table' }, el('thead', {}, head), el('tbody', {}, ...body))),
      el('div', { class: 'legend-hint' }, el('span', {}, 'Click a row to isolate it, ⌘ or Ctrl-click to add or remove one.'), shown.size < rows.length ? reset : null));
  }

  function sparkline(container, c) {
    const suite = data.suites.find((s) => s.key === 'size');
    if (!suite || !data.load.size) return;
    const width = Math.max(120, container.clientWidth);
    const height = 44;
    const all = contenders.flatMap((k) => suite.points.map((p) => value('size', p.key, k.key, state.cache, 'appMs')));
    const { y, ok } = yScale(all, 3, height - 6, true);
    const values = suite.points.map((p) => value('size', p.key, c.key, state.cache, 'appMs'));
    const x = (i) => (i / (suite.points.length - 1)) * (width - 4) + 2;
    const plotted = values.map((v, i) => [i, v]).filter(([, v]) => ok(v));
    if (!plotted.length) return;
    const line = plotted.map(([i, v], n) => `${n ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    const area = `${line}L${x(plotted[plotted.length - 1][0]).toFixed(1)},${height}L${x(plotted[0][0]).toFixed(1)},${height}Z`;
    const svg = svgEl('svg', { class: 'sparkline', width, height, viewBox: `0 0 ${width} ${height}`, role: 'img', tabindex: '0', 'aria-label': `Server time of ${c.label} from 1 to ${suite.points[suite.points.length - 1].label}` });
    svg.append(svgEl('path', { d: area, fill: color(c.key), opacity: 0.16 }), svgEl('path', { d: line, fill: 'none', stroke: color(c.key), 'stroke-width': 1.5, 'stroke-linejoin': 'round' }));
    attachTip(svg, () => [
      el('strong', {}, `${c.label}: server time per records per request`),
      ...suite.points.map((p, i) => tipRow(null, p.label, unsupported(c, p) ? `max. ${c.maxPageSize.size}` : `${fmt(values[i], 1)} ms`)),
    ]);
    container.append(svg);
  }

  // Panels
  const WORDS = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'];
  const requestPoint = () => baseSuite.points.find((p) => p.key === state.request);
  const cacheLabel = () => passes.find((p) => p.key === state.cache).label;
  const sourceNote = (suiteKey) => {
    const source = data.sources?.[suiteKey];
    return source ? `Measured ${fmtDate(source.date)}, median of ${source.repetitions} repetitions.` : '';
  };
  const loadTip = (c, m) => (m ? [
    el('strong', {}, `${c.label} · ${requestPoint().label}, ${cacheLabel().toLowerCase()}`),
    tipRow(c.key, 'Throughput', `${fmt(m.rps)} req/s`),
    tipRow(c.key, 'Median', `${fmt(m.p50, 1)} ms`),
    tipRow(c.key, 'p95 / p99', `${fmt(m.p95, 1)} / ${fmt(m.p99, 1)} ms`),
    tipRow(c.key, 'Queries', fmt(m.queries)),
    tipRow(c.key, 'Server time', `${fmt(m.appMs, 1)} ms`),
    tipRow(c.key, 'Memory', `${fmt(m.memoryMb, 1)} MB`),
    tipRow(c.key, 'Response', `${fmt(m.payloadKb, 1)} KB`),
  ] : [el('strong', {}, c.label), 'no data']);

  function rows() {
    const selected = contenders.filter((c) => state.api.has(c.key));
    const point = requestPoint();
    const result = [];

    const statWidth = selected.length <= 4 ? 24 / selected.length : selected.length <= 6 ? 4 : 3;
    const baseMetric = (c) => data.load.base?.[state.request]?.[c.key]?.[state.cache];
    const fastest = Math.min(...selected.map((c) => baseMetric(c)?.appMs).filter(Number.isFinite));
    result.push({ id: 'overview', title: 'Overview', panels: [
      { id: 'about', type: 'text', title: 'About', w: 24, render: (body) => body.append(el('div', { class: 'about' },
        el('h2', {}, `${WORDS[contenders.length] || contenders.length} ways to serve the same TYPO3 records as JSON`),
        el('p', {}, 'tca_api, t3api, sg_apicore and nnrestapi against hand-written endpoints on the core Record API and Extbase. Every API runs from its own package with its own cache switched on, is load-tested cold and cached, probed for correct and fresh data, and counted in lines of configuration.'),
        el('p', { class: 'hints' }, 'Hover a series to highlight it in every panel. Click a legend row to isolate it. Over a panel, press ', el('kbd', {}, 'v'), ' to view it full size or ', el('kbd', {}, 'i'), ' to inspect its data. The variables above apply to every panel and end up in the URL.'),
      )) },
      ...selected.map((c) => ({
        id: `stat-${c.key}`, type: 'stat', title: c.label, w: statWidth, style: { '--sc': color(c.key) },
        description: `${versionText(c)}. Server time for ${point.label.toLowerCase()}, ${cacheLabel().toLowerCase()}. The curve is server time from 1 to 1,000 records per request on a logarithmic scale shared by all APIs.`,
        data: () => ({ note: `${point.label}, ${cacheLabel().toLowerCase()}`, headers: [{ label: 'Metric' }, { label: 'Value', num: 1, digits: 1 }], rows: METRICS.map((m) => [`${m.label} (${m.unit})`, baseMetric(c)?.[m.key] ?? NaN]) }),
        render: (body) => {
          const m = baseMetric(c);
          const stat = el('div', { class: 'stat', 'data-series': c.key },
            el('div', { class: 'stat-value' }, m ? fmt(m.appMs, 1) : '–', el('span', { class: 'stat-unit' }, 'ms')),
            el('div', { class: 'stat-sub' }, !m ? 'no data' : m.appMs === fastest ? 'fastest server time' : `${fmt(m.appMs / fastest, 1)}× the fastest`),
            m ? el('div', { class: 'stat-meta' }, `${fmt(m.queries)} queries · ${fmt(m.rps)} req/s · ${fmt(m.payloadKb, 1)} KB`) : null);
          body.append(stat);
          sparkline(stat, c);
        },
      })),
    ] });

    const gauges = [
      { id: 'rps', title: 'Throughput', unit: 'req/s', pick: (m) => m.rps, description: 'Requests per second at the client. Higher is better.' },
      { id: 'p50', title: 'Response time', unit: 'ms', digits: 1, pick: (m) => m.p50, range: true, description: 'Median response time at the client. The whisker spans the lowest and highest median across the repetitions. Lower is better.' },
      { id: 'queries', title: 'Database queries', unit: '', pick: (m) => m.queries, description: 'Queries per request, counted by a DBAL driver middleware. Lower is better.' },
      { id: 'app', title: 'Server time', unit: 'ms', digits: 1, pick: (m) => m.appMs, description: 'Time inside TYPO3, measured by the first middleware of the frontend stack. Lower is better.' },
    ];
    const loadTable = (panelId) => () => {
      const shown = visible(panelId);
      return {
        note: `${point.label}, ${cacheLabel().toLowerCase()}. ${sourceNote('base')}`,
        headers: [{ label: 'API' }, { label: 'req/s', num: 1 }, { label: 'p50 ms', num: 1, digits: 1 }, { label: 'p50 min', num: 1, digits: 1 }, { label: 'p50 max', num: 1, digits: 1 }, { label: 'p95 ms', num: 1, digits: 1 }, { label: 'p99 ms', num: 1, digits: 1 }, { label: 'Queries', num: 1 }, { label: 'Server ms', num: 1, digits: 1 }, { label: 'Memory MB', num: 1, digits: 1 }, { label: 'Response KB', num: 1, digits: 1 }, { label: 'Errors %', num: 1, digits: 1 }],
        series: shown.map((c) => c.key),
        rows: shown.map((c) => { const m = baseMetric(c) || {}; return [c.label, m.rps ?? NaN, m.p50 ?? NaN, m.p50Min ?? NaN, m.p50Max ?? NaN, m.p95 ?? NaN, m.p99 ?? NaN, m.queries ?? NaN, m.appMs ?? NaN, m.memoryMb ?? NaN, m.payloadKb ?? NaN, (m.errorRate || 0) * 100]; }),
      };
    };
    result.push({ id: 'requests', title: `Typical requests: ${point.label.toLowerCase()}, ${cacheLabel().toLowerCase()}`, panels: [
      ...gauges.map((g) => ({
        id: g.id, type: 'gauge', title: g.title, w: 6, description: `${g.description} ${point.useCase}. ${sourceNote('base')}`, data: loadTable(g.id),
        render: (body) => barGauge(body, g.id, g.pick, { digits: g.digits, unit: g.unit, range: g.range, tip: loadTip }),
      })),
      { id: 'values', type: 'table', title: 'All values', w: 24, description: 'Every load test metric for the selected request and cache state. Click a column to sort.', data: loadTable('values'),
        render: (body) => body.append(el('div', { class: 'table-wrap' }, dataTable(loadTable('values')()))) },
    ] });

    result.push({ id: 'scaling', title: 'Scaling', panels: sweepSuites.map((suite) => {
      const capped = contenders.filter((c) => state.api.has(c.key) && suite.points.some((p) => unsupported(c, p)));
      return {
        id: suite.key, type: 'timeseries', title: suite.label, w: suite.key === 'size' ? 24 : 12,
        description: `${suite.question} ${suite.axis}. ${capped.map((c) => `${c.label} serves at most ${c.maxPageSize.size} records per request (${c.maxPageSize.reason}). `).join('')}${sourceNote(suite.key)}`,
        headerExtra: () => selectInput(METRICS, state.metric[suite.key], (metric) => { state.metric[suite.key] = metric; renderPanels(); }, `Metric for ${suite.label}`, 'panel-select'),
        data: () => {
          const metric = METRICS.find((m) => m.key === state.metric[suite.key]);
          const shown = visible(suite.key);
          return {
            note: `${metric.label} in ${metric.unit}, ${cacheLabel().toLowerCase()}. ${sourceNote(suite.key)}`,
            headers: [{ label: 'Step' }, { label: 'Use case' }, ...shown.map((c) => ({ label: c.label, num: 1, digits: metric.digits }))],
            rows: suite.points.map((p) => [p.label, p.useCase, ...shown.map((c) => (unsupported(c, p) ? `max. ${c.maxPageSize.size}` : value(suite.key, p.key, c.key, state.cache, metric.key)))]),
          };
        },
        render: (body, context) => {
          const chart = el('div', { class: 'ts-chart' });
          body.append(chart, legendTable(suite.key, suite));
          const height = context.viewing ? Math.max(320, window.innerHeight - 380) : suite.key === 'size' ? 300 : 260;
          lineChart(chart, suite, suite.key, height);
        },
      };
    }) });

    if (data.features) {
      const statusLabel = { yes: 'Yes', partial: 'Partly', no: 'No' };
      const check = (c, feature) => data.features.results[c.key]?.[feature.key] || { status: 'no', detail: 'not checked' };
      result.push({ id: 'features', title: 'Features, checked', panels: [{
        id: 'feature-matrix', type: 'table', title: 'Feature matrix', w: 24,
        description: `Each cell is the result of a request against the running API, compared with the database. "Fresh" means item and list showed the new value right after a backend edit through the DataHandler, while the cache was warm. Checked ${fmtDate(data.features.date)}.`,
        data: () => ({ note: `Checked ${fmtDate(data.features.date)}.`, headers: [{ label: 'Group' }, { label: 'Feature' }, ...selected.map((c) => ({ label: c.label }))], rows: data.features.list.map((f) => [f.group, f.label, ...selected.map((c) => `${statusLabel[check(c, f).status]}: ${check(c, f).detail}`)]) }),
        render: (body) => {
          const mark = (status) => {
            const svg = svgEl('svg', { width: 14, height: 14, viewBox: '0 0 14 14', 'aria-hidden': 'true' });
            svg.append(svgEl('path', { fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', d: status === 'yes' ? 'M2.5 7.5l3 3 6-7' : status === 'no' ? 'M3 3l8 8M11 3l-8 8' : 'M3 7h8' }));
            return svg;
          };
          const head = el('tr', {}, el('th', {}, 'Feature'), ...selected.map((c) => el('th', { class: 'api', 'data-series': c.key }, swatch(c.key), c.label)));
          const lines = [];
          let group = null;
          for (const feature of data.features.list) {
            if (feature.group !== group) {
              group = feature.group;
              lines.push(el('tr', { class: 'group' }, el('th', { colSpan: selected.length + 1 }, group)));
            }
            lines.push(el('tr', {}, el('td', {}, feature.label), ...selected.map((c) => {
              const result = check(c, feature);
              return el('td', { 'data-series': c.key }, el('span', { class: `status ${result.status}` }, mark(result.status), statusLabel[result.status]), el('span', { class: 'status-detail' }, result.detail));
            })));
          }
          body.append(el('div', { class: 'table-wrap' }, el('table', { class: 'matrix' }, el('thead', {}, head), el('tbody', {}, ...lines))));
        },
      }] });
    }

    const footprint = data.footprint;
    result.push({ id: 'footprint', title: 'Configuration footprint', panels: [
      {
        id: 'footprint-lines', type: 'gauge', title: 'Lines of code and configuration', w: 12,
        description: "Everything in each API's package except composer.json, in non-empty lines. Files that exist only for the relation depth sweep are counted separately. Lower is less to maintain.",
        data: () => ({ headers: [{ label: 'API' }, { label: 'Lines', num: 1 }, { label: 'Files', num: 1 }, { label: 'PHP classes', num: 1 }, { label: 'Depth sweep lines', num: 1 }, { label: 'Outside the package' }], series: selected.map((c) => c.key), rows: selected.map((c) => [c.label, footprint[c.key].lines, footprint[c.key].files.length, footprint[c.key].classes, footprint[c.key].depth?.lines ?? 0, footprint[c.key].outside.join('; ').replace(/`/g, '')]) }),
        render: (body) => {
          const max = niceMax(Math.max(...selected.map((c) => footprint[c.key].lines)) * 1.05);
          const gauge = el('div', { class: 'gauge' });
          for (const c of selected) {
            const f = footprint[c.key];
            const track = el('div', { class: 'gauge-track', tabindex: '0', 'data-series': c.key, 'aria-label': `${c.label}: ${f.lines} lines` }, el('span', { class: 'gauge-bar', style: { width: `${(f.lines / max) * 100}%`, '--sc': color(c.key) } }));
            attachTip(track, () => [el('strong', {}, c.label), tipRow(c.key, 'Lines', fmt(f.lines)), tipRow(c.key, 'Files', fmt(f.files.length)), tipRow(c.key, 'PHP classes', fmt(f.classes)), ...f.outside.map((o) => tipRow(null, `+ ${o.replace(/`/g, '')}`, ''))]);
            gauge.append(el('span', { class: 'gauge-label', 'data-series': c.key }, c.label), track, el('span', { class: 'gauge-value', 'data-series': c.key }, fmt(f.lines), el('span', { class: 'unit' }, 'lines')));
          }
          body.append(gauge);
        },
      },
      {
        id: 'footprint-files', type: 'text', title: 'Files per package', w: 12,
        render: (body) => body.append(...selected.map((c) => {
          const f = footprint[c.key];
          return el('details', { class: 'pkg', 'data-series': c.key },
            el('summary', {}, swatch(c.key), `${c.label}: ${f.files.length} files, ${f.classes} PHP classes`),
            el('ul', { class: 'files' }, ...f.files.map((file) => el('li', {}, el('span', {}, file.path), el('span', {}, `${file.lines}`)))),
            f.outside.length ? el('p', { class: 'panel-note' }, `Outside the package: ${f.outside.join(', ').replace(/`/g, '')}`) : null,
            f.depth?.files.length ? el('p', { class: 'panel-note' }, `Plus ${f.depth.lines} lines in ${f.depth.files.length} ${f.depth.files.length === 1 ? 'file' : 'files'} for the relation depth sweep.`) : null);
        })),
      },
    ] });

    const profiles = data.profiles;
    if (contenders.some((c) => profiles[c.key])) {
      result.push({ id: 'profiles', title: 'Code loaded per request', panels: [
        {
          id: 'profile-files', type: 'gauge', title: 'Included PHP files', w: 12,
          description: 'PHP files included by one cold collection request of 20 articles, from a T3Flare profile. More files means more framework between the request and the data.',
          data: () => ({ headers: [{ label: 'API' }, { label: 'PHP files', num: 1 }, { label: 'Queries', num: 1 }], series: selected.map((c) => c.key), rows: selected.map((c) => [c.label, profiles[c.key]?.includedFiles ?? NaN, profiles[c.key]?.queries ?? NaN]) }),
          render: (body) => {
            const max = niceMax(Math.max(0, ...selected.map((c) => profiles[c.key]?.includedFiles ?? 0)) * 1.05);
            const gauge = el('div', { class: 'gauge' });
            for (const c of selected) {
              const files = profiles[c.key]?.includedFiles;
              const track = el('div', { class: 'gauge-track', tabindex: '0', 'data-series': c.key, 'aria-label': `${c.label}: ${fmt(files)} files` }, files ? el('span', { class: 'gauge-bar', style: { width: `${(files / max) * 100}%`, '--sc': color(c.key) } }) : null);
              attachTip(track, () => [el('strong', {}, c.label), tipRow(c.key, 'PHP files', fmt(files)), tipRow(c.key, 'Queries', fmt(profiles[c.key]?.queries))]);
              gauge.append(el('span', { class: 'gauge-label', 'data-series': c.key }, c.label), track, el('span', { class: 'gauge-value', 'data-series': c.key }, files ? fmt(files) : 'n/a', files ? el('span', { class: 'unit' }, 'files') : null));
            }
            body.append(gauge);
          },
        },
        {
          id: 'profile-findings', type: 'text', title: 'Profiler findings', w: 12,
          render: (body) => body.append(...selected.map((c) => {
            const findings = profiles[c.key]?.findings || [];
            return el('div', { 'data-series': c.key, style: { marginBottom: '8px' } }, el('div', { class: 'small', style: { fontWeight: 500 } }, swatch(c.key), c.label),
              findings.length ? el('ul', { class: 'findings' }, ...findings.map((f) => el('li', {}, f))) : el('p', { class: 'small muted', style: { margin: '2px 0 0' } }, 'No findings'));
          })),
        },
      ] });
    }

    const list = (items) => (body) => body.append(el('ul', {}, ...items.map((text) => el('li', {}, text))));
    result.push({ id: 'method', title: 'Method and limits', panels: [
      { id: 'method-how', type: 'text', title: 'How it is measured', w: 8, render: list([
        `Each step: flush all caches, warm up PHP and TYPO3 on URLs outside the measured range, then one cold and one cached pass with k6, ${env.vus} concurrent virtual users unless the step varies them.`,
        'Typical requests: 200 pages of 20 articles, 80 pages of 100, or 500 single articles. Sweeps: up to 50 pages per step, 200 for concurrent users. Every URL once per pass.',
        `The whole matrix runs ${env.repetitions} times, rotating over the APIs, so noise from the host spreads evenly.`,
        'Queries, server time and memory come from a middleware that runs first in the TYPO3 frontend stack, identical for every API.',
        'Production setup: no dev dependencies, authoritative classmap, OPcache without timestamp checks, every API response cache and the page cache on the same file backend.',
        ...contenders.filter((c) => c.isolated).map((c) => `${c.label} is installed only for a measurement phase of its own, after the shared one, because it ${c.isolated}. The other APIs are measured without it.`),
      ]) },
      { id: 'method-limits', type: 'text', title: 'What to keep in mind', w: 8, render: list([
        'One machine runs PHP, the database and the load generator, with no network latency to the database. Compare the APIs, not the absolute values. On a remote database every additional query costs a round trip, so per-row loading falls further behind.',
        'Payloads differ: tca_api and t3api return Hydra JSON-LD with @id, @type and pagination links; sg_apicore leaves out categories; nnrestapi returns published as a Unix timestamp.',
        'One dataset: 10,000 articles by 2,000 authors in 300 organizations in 25 countries, 15 tags and 8 categories; 2–4 tags and 1–3 categories per article.',
        'Each package is written the way its API documents it. Where an API cannot do part of the task, the gap is shown instead of worked around.',
      ]) },
      { id: 'method-reproduce', type: 'text', title: 'Reproduce', w: 8, render: (body) => body.append(el('pre', {}, 'ddev start && ddev composer install\nbin/env prod\nbin/bench load\nbin/bench features\nbin/bench footprint\nbin/bench site')) },
    ] });
    return result;
  }

  // Rendering
  function renderNav() {
    document.getElementById('brand-logo').replaceChildren(icon('logo', 22));
    const actions = document.getElementById('nav-actions');
    const dates = [...new Set(Object.values(data.sources || {}).map((s) => fmtDate(s.date)))];
    const runs = el('button', { type: 'button', class: 'tbtn', 'aria-haspopup': 'dialog', 'aria-expanded': 'false' }, icon('clock'), el('span', { class: 'runs-label' }, dates.length ? dates.join(' – ') : fmtDate(env.date)), icon('caret', 14));
    runs.addEventListener('click', () => openPopover(runs, el('dl', { class: 'info-list' },
      el('h4', {}, 'Runs'),
      ...data.suites.flatMap((s) => (data.sources?.[s.key] ? [el('dt', {}, s.label), el('dd', {}, `${fmtDate(data.sources[s.key].date)}, ${data.sources[s.key].repetitions}×`)] : [])),
      el('h4', {}, 'Environment'),
      el('dt', {}, 'TYPO3'), el('dd', {}, (versions['typo3/cms-core'] || '').replace(/^v/, '')),
      el('dt', {}, 'PHP'), el('dd', {}, env.php),
      el('dt', {}, 'Database'), el('dd', {}, env.database.replace(/^mariadb/i, 'MariaDB').replace(/^mysql/i, 'MySQL')),
      el('dt', {}, 'Setup'), el('dd', {}, env.mode === 'prod' ? 'Production' : 'Development'),
      el('dt', {}, 'Default users'), el('dd', {}, env.vus),
      el('h4', {}, 'APIs'),
      ...contenders.flatMap((c) => [el('dt', {}, c.label), el('dd', {}, versionText(c))]),
    ), 'end'));
    const share = el('button', { type: 'button', class: 'tbtn' }, icon('share'), el('span', { class: 'runs-label' }, 'Share'));
    share.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(new URL(urlFor(), location.href).href);
        toast('Link to this view copied');
      } catch { toast('Copying is not available here, use the address bar'); }
    });
    const kiosk = el('button', { type: 'button', class: 'tbtn icon', 'aria-label': 'Kiosk mode', title: 'Kiosk mode' }, icon('kiosk'));
    kiosk.addEventListener('click', () => { state.kiosk = true; render(); toast('Kiosk mode, press Esc to exit'); });
    const theme = el('button', { type: 'button', class: 'tbtn icon' });
    const isDark = () => (document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
    const syncTheme = () => { theme.replaceChildren(icon(isDark() ? 'sun' : 'moon')); theme.setAttribute('aria-label', isDark() ? 'Light theme' : 'Dark theme'); theme.title = theme.getAttribute('aria-label'); };
    theme.addEventListener('click', () => {
      const next = isDark() ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch {}
      syncTheme();
    });
    syncTheme();
    actions.replaceChildren(runs, share, kiosk, theme);
  }

  function renderVarbar() {
    const summary = () => (state.api.size === contenders.length ? 'All' : contenders.filter((c) => state.api.has(c.key)).map((c) => c.label).join(' + '));
    const apiLabel = el('span', {}, summary());
    const api = el('button', { type: 'button', class: 'var-input', 'aria-haspopup': 'listbox', 'aria-expanded': 'false', 'aria-label': 'API' }, apiLabel, icon('caret', 14));
    api.addEventListener('click', () => {
      const boxes = [];
      const update = () => {
        apiLabel.textContent = summary();
        boxes.forEach(({ input, key }) => { input.checked = key ? state.api.has(key) : state.api.size === contenders.length; });
        renderPanels();
      };
      const item = (key, label, extra) => {
        const input = el('input', { type: 'checkbox' });
        input.addEventListener('change', () => {
          if (!key) state.api = new Set(contenders.map((c) => c.key));
          else if (input.checked) state.api.add(key);
          else if (state.api.size > 1) state.api.delete(key);
          update();
        });
        boxes.push({ input, key });
        return el('label', { class: 'check-item', 'data-series': key || undefined }, input, key ? swatch(key) : null, label, extra ? el('span', { class: 'muted' }, extra) : null);
      };
      const list = el('div', { role: 'group', 'aria-label': 'APIs' }, item(null, 'All'), el('div', { class: 'menu-sep' }), ...contenders.map((c) => item(c.key, c.label, c.isolated ? 'own phase' : null)));
      boxes.forEach(({ input, key }) => { input.checked = key ? state.api.has(key) : state.api.size === contenders.length; });
      openPopover(api, list);
    });
    const variable = (label, input) => el('div', { class: 'variable' }, el('span', { class: 'var-label', 'aria-hidden': 'true' }, label), input);
    document.getElementById('varbar').replaceChildren(
      variable('API', api),
      variable('Request', selectInput(baseSuite.points.map((p) => ({ key: p.key, label: p.label })), state.request, (v) => { state.request = v; renderPanels(); }, 'Request')),
      variable('Cache', selectInput(passes, state.cache, (v) => { state.cache = v; renderPanels(); }, 'Cache')),
      variable('Y axis', selectInput(scales, state.scale, (v) => { state.scale = v; renderPanels(); }, 'Y axis of the scaling charts')),
      el('span', { class: 'var-spacer' }),
      el('div', { class: 'links' }, ...[
        `TYPO3 ${(versions['typo3/cms-core'] || '').replace(/^v/, '')}`,
        `PHP ${env.php}`,
        env.database.replace(/^mariadb/i, 'MariaDB').replace(/^mysql/i, 'MySQL'),
        env.mode === 'prod' ? 'Production setup' : 'Development setup',
      ].map((text) => el('span', { class: 'link-chip' }, text))),
    );
  }

  function renderPanels() {
    syncUrl();
    hideTip();
    setFocus(null);
    document.body.classList.toggle('kiosk', state.kiosk);
    const main = document.getElementById('dashboard');
    const all = rows();
    const pending = [];
    main.replaceChildren();

    const viewed = state.view && all.flatMap((r) => r.panels).find((p) => p.id === state.view);
    if (state.view && !viewed) state.view = null;
    if (viewed) {
      const back = el('button', { type: 'button', class: 'tbtn' }, icon('back'), 'Back to dashboard');
      back.addEventListener('click', () => toggleView(viewed.id));
      const { node, body } = panelNode(viewed);
      main.append(el('div', { class: 'view-bar' }, back, el('span', { class: 'small muted' }, 'or press ', el('kbd', {}, 'Esc'))), el('div', { class: 'panels' }, node));
      viewed.render(body, { viewing: true });
      return;
    }

    for (const row of all) {
      const collapsed = state.collapsed.has(row.id);
      const head = el('button', { type: 'button', class: 'row-head', 'aria-expanded': String(!collapsed) }, icon(collapsed ? 'chevron' : 'caret'), el('span', { class: 'row-title' }, row.title), collapsed ? el('span', { class: 'row-count' }, `(${row.panels.length} ${row.panels.length === 1 ? 'panel' : 'panels'})`) : null);
      head.addEventListener('click', () => {
        if (collapsed) state.collapsed.delete(row.id); else state.collapsed.add(row.id);
        try { localStorage.setItem('bench-collapsed', JSON.stringify([...state.collapsed])); } catch {}
        renderPanels();
      });
      const section = el('div', { class: 'row', 'data-row': row.id }, head);
      if (!collapsed) {
        const grid = el('div', { class: 'panels' });
        for (const panel of row.panels) {
          const { node, body } = panelNode(panel);
          grid.append(node);
          pending.push([panel, body]);
        }
        section.append(grid);
      }
      main.append(section);
    }
    main.append(el('footer', {}, `Generated ${new Date(data.generated).toLocaleString('en-GB')} from benchmark/results. Features checked ${data.features ? fmtDate(data.features.date) : 'never'}.`));
    for (const [panel, body] of pending) panel.render(body, { viewing: false });
  }

  function render() {
    renderNav();
    renderVarbar();
    renderPanels();
  }

  const stored = (() => { try { return localStorage.getItem('theme'); } catch { return null; } })();
  if (stored) document.documentElement.dataset.theme = stored;

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      if (!popover.hidden) closePopover();
      else if (!drawer.hidden) closeDrawer();
      else if (state.view) toggleView(state.view);
      else if (state.kiosk) { state.kiosk = false; render(); }
      return;
    }
    if (event.metaKey || event.ctrlKey || event.altKey || event.target.closest?.('input, select, textarea')) return;
    if (event.key === 'v' && hoveredPanel) toggleView(hoveredPanel.id);
    else if (event.key === 'i' && hoveredPanel?.data) inspect(hoveredPanel);
  });
  let resizeTimer;
  let lastWidth = window.innerWidth;
  window.addEventListener('resize', () => {
    if (window.innerWidth === lastWidth && !state.view) return;
    lastWidth = window.innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderPanels, 150);
  });

  render();
})();
</script>
</body>
</html>
